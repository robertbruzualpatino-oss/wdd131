<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <meta name="description" content="This is the responsive images project of WDD 131 - Dynamic Web Fundamentals.">
    <meta name="author" content="Robert Bruzual">
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">

                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">

                <img src="images/hero-small.webp" alt="Temple of the Church of Jesus Christ, Outside view with beautiful gardens" width="1500" height="750" loading="lazy">
            </picture>
        </div>
    </main>
</body>
</html>
