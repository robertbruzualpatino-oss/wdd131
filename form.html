<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Robert Bruzual</title>
    <meta name="description" content="WDD 131: Product Review Form assignment featuring dynamic JavaScript and local storage by Gabriel Bruzual.">
    <meta name="author" content="Robert Bruzual">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="productName">Product Name *</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-fieldset">
                <legend>Overall Rating *</legend>
                <div class="stars">
                    <label for="star1"><span>★</span><input type="radio" id="star1" name="rating" value="1" required></label>
                    <label for="star2"><span>★★</span><input type="radio" id="star2" name="rating" value="2" required></label>
                    <label for="star3"><span>★★★</span><input type="radio" id="star3" name="rating" value="3" required></label>
                    <label for="star4"><span>★★★★</span><input type="radio" id="star4" name="rating" value="4" required></label>
                    <label for="star5"><span>★★★★★</span><input type="radio" id="star5" name="rating" value="5" required></label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset class="features-fieldset">
                <legend>Which features did you find useful in the product? <br><em>(Check all that apply)</em></legend>
                <label for="feature1"><input type="checkbox" id="feature1" name="features" value="Durability"> Durability</label>
                <label for="feature2"><input type="checkbox" id="feature2" name="features" value="Ease of Use"> Ease of Use</label>
                <label for="feature3"><input type="checkbox" id="feature3" name="features" value="Performance"> Performance</label>
                <label for="feature4"><input type="checkbox" id="feature4" name="features" value="Design"> Design</label>
            </fieldset>

            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Robert Bruzual | Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
