<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation - Robert Bruzual</title>
    <meta name="description" content="Confirmation page tracking total user reviews via localStorage.">
    <meta name="author" content="Robert Bruzual">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>
<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="confirmation-container">
        <h2>Thank You!</h2>
        <p>Your product review has been submitted successfully.</p>
        <div class="counter-box">
            <p>You have submitted <strong><span id="reviewCounter">0</span></strong> reviews.</p>
        </div>
        <a href="form.html" class="return-link">Submit Another Review</a>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Robert Bruzual | Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
